<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusChat | Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="shortcut icon" href="./public/assets/favicon.svg" type="image/x-icon">
    <style>
        /* ---------- reset & base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #7c3aed;
            --dark-color: #1e293b;
            --light-color: #f8fafc;
            --gray-color: #64748b;
            --gray-light: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --border-radius: 12px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.1);
            --gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --gradient-success: linear-gradient(135deg, #10b981 0%, #34d399 100%);
        }

        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ---------- background animation (same as signup) ---------- */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .node {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
            opacity: 0.2;
        }

        .connection {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            opacity: 0.1;
            transform-origin: left center;
        }

        /* ---------- main container ---------- */
        .container {
            display: flex;
            width: 100%;
            max-width: 650px;
            min-height: 580px;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        /* ---------- form section ---------- */
        .form-section {
            flex: 1.2;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            overflow: hidden;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header h1 {
            font-size: 32px;
            color: var(--dark-color);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .form-header p {
            color: var(--gray-color);
            font-size: 15px;
        }

        /* ---------- form elements ---------- */
        .forgot-form {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
            font-size: 14px;
        }

        .form-group label.required::after {
            content: " *";
            color: var(--error-color);
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-color);
            font-size: 18px;
        }

        .form-control {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border: 1px solid var(--gray-light);
            border-radius: var(--border-radius);
            font-size: 16px;
            transition: all 0.3s;
            background-color: #f8fafc;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-control.error {
            border-color: var(--error-color);
            background-color: rgba(239, 68, 68, 0.05);
        }

        .form-control.success {
            border-color: var(--success-color);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .validation-message {
            font-size: 13px;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .validation-message.error {
            color: var(--error-color);
        }

        .validation-message.success {
            color: var(--success-color);
        }

        .validation-message i {
            font-size: 14px;
        }

        /* ---------- messages ---------- */
        .message {
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            display: none;
        }

        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .warning-message {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .info-message {
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .message i {
            margin-right: 10px;
            font-size: 18px;
        }

        /* ---------- buttons ---------- */
        .signup-button {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }

        .signup-button:active {
            transform: translateY(0);
        }

        .signup-button:disabled {
            background: var(--gray-light);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .signup-button.success {
            background: var(--gradient-success);
        }

        .signup-button.secondary {
            background: transparent;
            color: var(--primary-color);
            box-shadow: none;
            border: 1px solid var(--gray-light);
        }

        .signup-button.secondary:hover {
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            color: var(--gray-color);
            font-size: 15px;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* ---------- divider & social (kept for consistency) ---------- */
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0 20px;
            color: var(--gray-color);
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--gray-light);
        }

        .divider span {
            padding: 0 15px;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--gray-light);
            border-radius: var(--border-radius);
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .social-btn.google {
            color: #ea4335;
        }

        .social-btn.github {
            color: #333;
        }

        .social-btn.linkedin {
            color: #0a66c2;
        }

        /* ---------- responsive ---------- */
        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                min-height: 100vh;
            }

            .form-section {
                padding: 30px 20px;
            }

            .form-header h1 {
                font-size: 26px;
            }

            .social-login {
                flex-direction: column;
            }
        }

        /* ---------- loading spinner (inline) ---------- */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Background animation (same as signup) -->
    <div class="bg-animation" id="bgAnimation"></div>

    <div class="container">
        <!-- Form section -->
        <div class="form-section">
            <div class="form-header">
                <div class="logo">
                    <div class="logo-icon">
                        <img src="./assets/favicon.svg" alt="NexusChat" />
                    </div>
                    <div class="logo-text">NexusChat</div>
                </div>
                <h1>Forgot Password?</h1>
                <p>Enter your email or username and we'll send you a reset link</p>
            </div>

            <!-- Messages (hidden by default) -->
            <div class="message error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Please fill in your email or username.</span>
            </div>
            <div class="message success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <span id="successText">Reset link sent! Check your inbox.</span>
            </div>
            <div class="message warning-message" id="warningMessage">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="warningText">Please review the highlighted field.</span>
            </div>
            <div class="message info-message" id="infoMessage">
                <i class="fas fa-info-circle"></i>
                <span id="infoText">Sending reset link…</span>
            </div>

            <!-- Forgot password form -->
            <form class="forgot-form" id="forgotForm">
                <div class="form-group">
                    <label for="resetIdentifier" class="required">Email or Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="resetIdentifier" class="form-control"
                            placeholder="Enter your email or username" autocomplete="off" />
                    </div>
                    <div class="validation-message" id="identifierValidation"></div>
                </div>

                <button type="submit" class="signup-button" id="sendResetButton">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>

                <div class="back-link">
                    <i class="fas fa-arrow-left" style="margin-right: 6px;"></i>
                    <a href="/" id="backToLogin">Back to Login</a>
                </div>
            </form>

            <!-- 
            <div class="divider">
                <span>Or continue with</span>
            </div>
            <div class="social-login">
                <button type="button" class="social-btn google"><i class="fab fa-google"></i> Google</button>
                <button type="button" class="social-btn github"><i class="fab fa-github"></i> GitHub</button>
                <button type="button" class="social-btn linkedin"><i class="fab fa-linkedin"></i> LinkedIn</button>
            </div> -->
        </div>
    </div>
    <script type="module" src="/src/js/auth/forgot-password.js"></script>
</body>

</html>
