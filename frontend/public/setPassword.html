<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · NexusChat</title>
  <!-- Font Awesome & Inter font (same as original) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---------- minimal reset & base (same style as login) ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    :root {
      --primary-color: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary-color: #7c3aed;
      --dark-color: #1e293b;
      --light-color: #f8fafc;
      --gray-color: #64748b;
      --gray-light: #e2e8f0;
      --success-color: #10b981;
      --error-color: #ef4444;
      --border-radius: 12px;
      --shadow: 0 10px 25px rgba(0,0,0,0.05);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.1);
      --gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    }
    body {
      background-color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    /* subtle bg animation (reduced) */
    .bg-animation {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .node {
      position: absolute;
      width: 6px; height: 6px;
      background-color: var(--primary-color);
      border-radius: 50%;
      opacity: 0.15;
    }
    .container {
      display: flex;
      width: 100%;
      max-width: 480px;   /* narrower, focused on reset */
      min-height: 500px;
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      flex-direction: column;
    }
    /* form section only – full width */
    .form-section {
      flex: 1;
      padding: 40px 32px 40px 32px;
      display: flex;
      flex-direction: column;
    }
    .form-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .form-header h2 {
      font-size: 28px;
      color: var(--dark-color);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .form-header p {
      color: var(--gray-color);
      font-size: 15px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark-color);
      font-size: 14px;
    }
    .input-with-icon {
      position: relative;
    }
    .input-with-icon i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-color);
      font-size: 18px;
    }
    .form-control {
      width: 100%;
      padding: 16px 16px 16px 50px;
      border: 1px solid var(--gray-light);
      border-radius: var(--border-radius);
      font-size: 16px;
      transition: all 0.3s;
      background-color: #f8fafc;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: white;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .reset-button {
      width: 100%;
      padding: 16px;
      background: var(--gradient);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.2);
    }
    .reset-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37,99,235,0.25);
    }
    .reset-button:active { transform: translateY(0); }
    .reset-button:disabled {
      background: var(--gray-light);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    /* messages */
    .error-message, .success-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      display: none;
    }
    .error-message { background-color: rgba(239,68,68,0.1); color: var(--error-color); }
    .success-message { background-color: rgba(16,185,129,0.1); color: var(--success-color); }
    .error-message i, .success-message i { margin-right: 10px; font-size: 18px; }

    .signin-link {
      text-align: center;
      margin-top: 30px;
      color: var(--gray-color);
      font-size: 15px;
    }
    .signin-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }
    .signin-link a:hover { text-decoration: underline; }

    /* tiny responsive */
    @media (max-width: 480px) {
      .container { border-radius: 0; min-height: 100vh; }
      .form-section { padding: 30px 20px; }
    }

    /* spinner (same as login) */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- simple background decoration (same style) -->
  <div class="bg-animation" id="bgAnimation"></div>

  <!-- main container: only reset password card -->
  <div class="container">
    <div class="form-section">
      <div class="form-header">
        <!-- optional small icon / lock -->
        <div style="margin-bottom: 8px; color: var(--primary-color);">
          <i class="fas fa-key" style="font-size: 32px;"></i>
        </div>
        <h2>Set new password</h2>
        <p>Create a strong password for your account</p>
      </div>

      <!-- error / success messages -->
      <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Passwords do not match</span>
      </div>
      <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i>
        <span id="successText">Password updated! Redirecting…</span>
      </div>

      <!-- reset form -->
      <form id="resetForm">
        <!-- new password -->
        <div class="form-group">
          <label for="newPassword">New password</label>
          <div class="input-with-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required minlength="6">
          </div>
        </div>
        <!-- confirm password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <div class="input-with-icon">
            <i class="fas fa-check-circle"></i>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your new password" required minlength="6">
          </div>
        </div>

        <button type="submit" class="reset-button" id="resetButton">
          <span id="buttonText">Reset password</span>
        </button>

        <div class="signin-link">
          Remember your password? <a href="#" id="signinLink">Sign in</a>
        </div>
      </form>
    </div>
  </div>

    <script type="module" src="/src/js/auth/setPassword.js"></script>

</body>
</html>
